$props = @"
server.port=8501
spring.application.name=api-gateway

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=`${FRONTEND_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Rutas Auth / Usuarios (Puerto 8500)
spring.cloud.gateway.routes[0].id=usuarios-service-auth
spring.cloud.gateway.routes[0].uri=http://`${USUARIOS_HOST:localhost}:8500
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=usuarios-service-usuarios
spring.cloud.gateway.routes[1].uri=http://`${USUARIOS_HOST:localhost}:8500
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/usuarios/**

# Rutas Productos (Puerto 8081)
spring.cloud.gateway.routes[2].id=productos-service
spring.cloud.gateway.routes[2].uri=http://`${PRODUCTOS_HOST:localhost}:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/productos/**

# Rutas Pedidos (Puerto 8082)
spring.cloud.gateway.routes[3].id=pedidos-service
spring.cloud.gateway.routes[3].uri=http://`${PEDIDOS_HOST:localhost}:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pedidos/**

# Ruta Gateway para Docs de Usuarios
spring.cloud.gateway.routes[4].id=usuarios-swagger
spring.cloud.gateway.routes[4].uri=http://`${USUARIOS_HOST:localhost}:8500
spring.cloud.gateway.routes[4].predicates[0]=Path=/v3/api-docs/usuarios
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/v3/api-docs/usuarios, /v3/api-docs

# Ruta Gateway para Docs de Productos
spring.cloud.gateway.routes[5].id=productos-swagger
spring.cloud.gateway.routes[5].uri=http://`${PRODUCTOS_HOST:localhost}:8081
spring.cloud.gateway.routes[5].predicates[0]=Path=/v3/api-docs/productos
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/v3/api-docs/productos, /v3/api-docs

# Ruta Gateway para Docs de Pedidos
spring.cloud.gateway.routes[6].id=pedidos-swagger
spring.cloud.gateway.routes[6].uri=http://`${PEDIDOS_HOST:localhost}:8082
spring.cloud.gateway.routes[6].predicates[0]=Path=/v3/api-docs/pedidos
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/v3/api-docs/pedidos, /v3/api-docs

# Habilitar Swagger UI en el Gateway
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# URLs que consumira el Swagger UI del Gateway
springdoc.swagger-ui.urls[0].name=Servicio Usuarios y Auth
springdoc.swagger-ui.urls[0].url=/v3/api-docs/usuarios

springdoc.swagger-ui.urls[1].name=Servicio Productos
springdoc.swagger-ui.urls[1].url=/v3/api-docs/productos

springdoc.swagger-ui.urls[2].name=Servicio Pedidos
springdoc.swagger-ui.urls[2].url=/v3/api-docs/pedidos
"@
[System.IO.File]::WriteAllText("$PWD\gateway\src\main\resources\application.properties", $props, (New-Object System.Text.UTF8Encoding $false))